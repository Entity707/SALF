
writerConsole = console
writerConsole.format = {message}
writerConsole.level = info

#TODO: this isnt logging anything idk why
writerError = rolling file
writerError.file = resources/logs/errorLog{date}.txt
writerError.append = true
writerError.format = {date:yyyy-MM-dd HH:mm:ss} [{thread}] {logger} {level}: {message}
writerError.level = warn
writerError.policies = startup

writerActivity = rolling file
writerActivity.file = resources/logs/log{date}
writerActivity.append = true
writerActivity.format = {date:yyyy-MM-dd HH:mm:ss} {level}: {message}
writerActivity.convert = gzip
writerActivity.buffered = true
writerActivity.level = info
writerActivity.policies = startup

exception = strip: jdk.internal
writingthread = true
