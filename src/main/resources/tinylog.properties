
writerConsole = console
writerConsole.format = {date:HH:mm:ss} {level}: {message}
writerConsole.level = info

writerError = rolling file
writerError.file = resources/logs/errorLog{date}-part{count}.txt

writerError.append = true
writerError.format = {date:yyyy-MM-dd'T'HH:mm:ssXXX} [{thread}] {level}: {message}
writerError.convert = gzip
writerError.level = warn
writerError.policies = startup, size: 10MB
writerError.backups = 20

writerActivity = rolling file
writerActivity.file = resources/logs/log{date}-part{count}.txt
writerActivity.append = true
writerActivity.format = {date:yyyy-MM-dd'T'HH:mm:ssXXX} {level}: {message}
writerActivity.convert = gzip
writerActivity.buffered = true
writerActivity.level = info
writerActivity.policies = startup, size: 10MB
writerActivity.backups = 20

exception = strip: jdk.internal
writingthread = true
